<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | AgroTech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f9f4;
            color: #333;
            text-align: center;
            padding: 80px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 3rem;
            color: #e63946;
            margin: 0 0 20px;
        }
        h2 {
            color: #2d6a4f;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            padding: 12px 30px;
            background-color: #2d6a4f;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        a:hover {
            background-color: #1b4332;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>🌱 Something went wrong on our end</h2>
        <p>We are experiencing an internal server issue. Our engineering team has been notified and we are working to resolve the issue as quickly as possible. Please try again in a few moments.</p>
        <a href="/">Go Back Home</a>
    </div>
</body>
</html>
